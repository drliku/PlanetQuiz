<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Planet Quiz</title>
  <meta name="description" content="How well do you know the Solar System? Answer against the clock and beat your best score." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main class="stage">
    <!-- ============ HOME ============ -->
    <section id="screen-home" class="screen active">
      <div class="home">
        <button class="sound-btn" id="sound-btn" aria-label="Toggle sound" aria-pressed="true">🔊</button>
        <div class="logo-planet" aria-hidden="true"><div class="logo-orbit"><span class="moon"></span></div></div>
        <h1 class="logo">Planet Quiz</h1>
        <p class="tagline">The faster you answer, the more points you get.</p>

        <div class="difficulty" id="difficulty" role="radiogroup" aria-label="Difficulty">
          <button class="diff" role="radio" data-diff="easy" id="diff-easy"><b>Easy</b><span>20s</span></button>
          <button class="diff" role="radio" data-diff="medium" id="diff-medium"><b>Medium</b><span>15s</span></button>
          <button class="diff" role="radio" data-diff="hard" id="diff-hard"><b>Hard</b><span>12s</span></button>
        </div>

        <button class="btn btn-play btn-start" id="btn-play"><span>Start</span></button>

        <div class="scores-panel">
          <h2>Highest scores <span class="mode-chip" id="scores-mode">Easy</span></h2>
          <ol class="score-list" id="score-list"></ol>
        </div>
      </div>
    </section>

    <!-- ============ GAME ============ -->
    <section id="screen-game" class="screen">
      <div class="hud">
        <button class="hud-btn" id="btn-quit" aria-label="Quit to menu">✕</button>
        <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="hud-count"><span id="q-num">1</span>/<span id="q-total">10</span></div>
      </div>

      <div class="hud-row">
        <div class="score-box">
          <span class="label">Score</span>
          <span class="score" id="score">0</span>
        </div>
        <div class="timer" id="timer">
          <svg viewBox="0 0 100 100">
            <circle class="timer-track" cx="50" cy="50" r="44"/>
            <circle class="timer-ring" id="timer-ring" cx="50" cy="50" r="44"/>
          </svg>
          <span id="timer-text">15</span>
        </div>
        <div class="streak-box" id="streak-box">
          <span class="label">Streak</span>
          <span class="streak"><span id="streak">0</span>🔥</span>
        </div>
      </div>

      <div class="worth" id="worth">⚡ <b id="worth-val">1000</b> pts</div>

      <div class="planet-wrap"><div class="planet" id="planet"></div></div>

      <div class="question-card" id="question-card">
        <h2 id="question">Question</h2>
      </div>

      <div class="options" id="options"></div>

      <div class="fact" id="fact" hidden></div>

      <div class="float-layer" id="float-layer"></div>
    </section>

    <!-- ============ RESULTS ============ -->
    <section id="screen-results" class="screen">
      <article class="card results-card">
        <div class="card-art results-art">
          <span class="twinkle t1"></span><span class="twinkle t2"></span><span class="twinkle t3"></span>
          <div class="rank-emoji" id="rank-emoji">🚀</div>
          <div class="rank-title" id="rank-title">Space Cadet</div>
          <div class="rank-sub" id="rank-sub">Easy</div>
          <div class="new-best" id="new-best" hidden>NEW HIGH SCORE!</div>
        </div>
        <div class="card-body">
          <div class="final-score"><span id="final-score">0</span><small>points</small></div>
          <div class="stats">
            <div class="stat"><b id="stat-correct">0/10</b><span>Correct</span></div>
            <div class="stat"><b id="stat-streak">0</b><span>Best streak</span></div>
            <div class="stat"><b id="stat-speed">0.0s</b><span>Avg speed</span></div>
          </div>
          <div class="placed" id="placed"></div>
          <div class="actions">
            <button class="btn btn-ghost" id="btn-home">Menu</button>
            <button class="btn btn-play" id="btn-again"><span>Play again</span>
              <svg viewBox="0 0 24 24" class="ico"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>
            </button>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
